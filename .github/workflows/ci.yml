name: CI

# Una sola esecuzione per commit: i rami passano dalla pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Test backend e worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      # I test non richiedono NEST: gli esperimenti lo importano solo quando girano.
      - run: pytest

  frontend:
    name: Test e build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
