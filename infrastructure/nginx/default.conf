server {
    listen 80;
    server_name localhost;

    # Regole per servire la build di Angular 18
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Fallback per il routing di Angular (SPA)
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy verso l'API FastAPI
    location /api/v1/ {
        proxy_pass http://api:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Gestione opzionale per WebSockets (se implementati in FastAPI)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}