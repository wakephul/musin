services:
  db:
    image: mysql:8.4
    env_file:
      - .env
    volumes:
      - musin_db_data:/var/lib/mysql
    # Database, Redis e console MinIO sono raggiungibili solo da questa macchina.
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # RELEASE.2025-09-07T16-13-09Z, fissata per digest: MinIO non pubblica più l'immagine
    # su Docker Hub, quindi si usa solo se è già in cache e mai una con contenuto diverso.
    # Altrove va indicata in MINIO_IMAGE una build di cui ci si fida, anch'essa per digest.
    image: ${MINIO_IMAGE:-minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e}
    env_file:
      - .env
    command: server /data --console-address ":9001"
    # La porta 9050 serve al browser per scaricare grafici e risultati (URL firmati).
    ports:
      - "9050:9000"
      - "127.0.0.1:9051:9001"
    volumes:
      - musin_minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api: &engine
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.engine
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./backend:/app/backend
      - ./worker:/app/worker
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *engine
    # Pool "solo": una simulazione alla volta, NEST usa già tutti i core assegnati.
    command: celery -A worker.celery_app worker --loglevel=info --pool=solo
    ports: []
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 20G
        reservations:
          cpus: "6.0"
          memory: 6G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  musin_db_data:
  musin_minio_data:
