services:
  db:
    image: mysql:8.4
    env_file:
      - .env
    volumes:
      - musin_db_data:/var/lib/mysql
    # Database, Redis e API sono raggiungibili solo da questa macchina.
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api: &engine
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.engine
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./worker:/app/worker
      # Risultati delle simulazioni e stimoli: il worker scrive, l'API legge.
      - musin_storage:/data
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *engine
    # Pool "solo": una simulazione alla volta, NEST usa già tutti i core assegnati.
    command: celery -A worker.celery_app worker --loglevel=info --pool=solo
    ports: []
    environment:
      # Thread di NEST: quanti i core concessi qui sotto. Su macchine con meno di 6 core
      # impostare WORKER_CPUS in .env, altrimenti Docker rifiuta di avviare il servizio.
      - NEST_THREADS=${WORKER_CPUS:-6}
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-6}"
          memory: ${WORKER_MEMORY:-20G}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Solo da questa macchina, finché non si è scelto di esporla: con MUSIN_BIND=0.0.0.0
    # in .env l'app risponde anche in rete (prima vanno cambiate le password di esempio).
    ports:
      - "${MUSIN_BIND:-127.0.0.1}:3000:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  musin_db_data:
  musin_storage:
