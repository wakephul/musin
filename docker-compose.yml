services:
  db:
    image: mysql:8.4
    env_file:
      - .env
    volumes:
      - musin_db_data:/var/lib/mysql
    # Database, Redis e API sono raggiungibili solo da questa macchina.
    ports:
      - "127.0.0.1:3307:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api: &engine
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.engine
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./worker:/app/worker
      # Risultati delle simulazioni e stimoli: il worker scrive, l'API legge.
      - musin_storage:/data
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *engine
    # Pool "solo": una simulazione alla volta, NEST usa già tutti i core assegnati.
    command: celery -A worker.celery_app worker --loglevel=info --pool=solo
    ports: []
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 20G
        reservations:
          cpus: "6.0"
          memory: 6G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  musin_db_data:
  musin_storage:
